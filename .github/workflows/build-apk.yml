name: Build MIETEKTEK67 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MIETEKTEK67-Android

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: ./android/gradlew assembleDebug
        working-directory: MIETEKTEK67-Android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIETEKTEK67-APK
          path: MIETEKTEK67-Android/android/app/build/outputs/apk/debug/app-debug.apk
